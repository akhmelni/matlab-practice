[project]
name = "matlab-practice"
version = "0.1.0"
description = "Local MATLAB practice app: verbatim homework problems, graded with GNU Octave, MATLAB-only syntax enforced"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
practice = "matlab_practice.server:main"
validate = "matlab_practice.validate:main"
check-setup = "matlab_practice.setup_check:main"
mcheck = "matlab_practice.checker.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
